[project]
name = "stable-audio-3"
version = "0.1.0"
description = "Gradio application for Stable Audio 3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alias-free-torch>=0.0.6",
    "einops>=0.8.0",
    "gradio>=4.0.0",
    "huggingface-hub>=0.20.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.8.0",
    "mir-eval>=0.8.2",
    "numpy<2",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "scipy>=1.11.0",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.0",
    "torch",
    "torchaudio",
    "torchcodec>=0.17.0",
    "torchvision",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stable_audio", "source_separation"]
